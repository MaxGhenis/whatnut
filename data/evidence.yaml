  population: "8 non-statin RCTs (4 diet, 2 bile acid sequestrant, 1 ileal bypass, 1 ezetimibe) within a 49-trial meta-regression of 312,175 participants and 39,645 major vascular events"
  notes: >-
    Random-effects meta-regression (REML, Knapp-Hartung), intercept fixed at 0; P = .002; difference from statins
    P = .72. Statins (25 trials): RR 0.77 (95% CI 0.71-0.84) per 1 mmol/L; primary prevention 0.70 (0.53-0.93),
    secondary 0.79 (0.73-0.86). Statins plus the four non-statin classes (33 trials): 0.77 (0.75-0.79).
    Diet is not given its own number in the main text: Figure 3 plots the 4 diet trials as one class-level
    fixed-effect point near the regression line, and the Results say each of the 5 established classes (statins,
    diet, sequestrants, ileal bypass, ezetimibe) fell within 0.02 of its predicted RR; per-class forest plots are
    in eFigures 3-12 of the Supplement, not retrieved. The 4 diet trials (Table footnote b and Figure 2B, refs 24, 25,
    49, 50): MRC Research Committee low-fat diet in myocardial infarction (Lancet 1965), MRC soya-bean oil in
    myocardial infarction (Lancet 1968), Oslo Diet-Heart Study (Leren, Circulation 1970), and Los Angeles Veterans
    trial of a diet high in unsaturated fat (Dayton, Circulation 1969). Diet column of the Table: 1903 participants,
    0 women, mean age 62, baseline LDL-C 4.0-5.6 mmol/L, 489 major vascular events, mean follow-up 4.4 y. None of the
    diet trials tested nuts; three of the four titles name a low-fat diet, soya-bean oil, or a diet high in
    unsaturated fat (the Oslo trial's diet was not read here). The
    non-statin trials are old and small next to the statin trials (several hundred events each for diet,
    sequestrants and ileal bypass; Discussion, limitations). Other classes, observed vs expected RR: niacin 0.94 vs
    0.91; fibrates 0.88 vs 0.94; CETP inhibitors 1.01 vs 0.90; PCSK9 inhibitors 0.49 vs 0.61.
    Funding: no study funding statement; Silverman was supported by NIH training grant 5T32HL007604; several
    authors report ties to Merck, Amgen and other lipid-drug makers (Conflict of Interest Disclosures).

  unit: "mg/dL per 28.4 g/day"
  estimate: -4.8
  ci_low: -5.5
  ci_high: -4.2
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Trial doses 5 to 100 g/day (median 56 g/day); durations 3 to 26 weeks (median 4 weeks)"
  population: "61 controlled trials (randomized and nonrandomized), 2582 adults without prevalent CVD"
  notes: >-
    Fixed-effects inverse-variance weighted mean difference, each trial dose-standardized to 28.4 g/day; all 61 trials
    (randomized and nonrandomized). Randomized trials only: see delgobbo2015_ldl_per28g_rct (-4.2); nonrandomized trials
    -6.0 (-7.1, -4.9); P interaction 0.01. Heterogeneity at least moderate (RCT I2 38.2%, nonrandomized I2 62.9%).
    Nut type: no significant differences by nut type, with few trials for some types (Results, 'Heterogeneity');
    abstract says heterogeneity by nut type was not significant; Discussion names dose, not nut type, as the major
    determinant. The per-type P values are in Supplemental Table 2, which was not retrieved (not in PMC; Europe PMC
    reports the article is not open access; ScienceDirect returned HTTP 403). Only n of 2 or fewer estimates for
    Brazil nut, cashew and pecan (Discussion, limitations).
    Dose-response nonlinear (P < 0.001 in text, 0.001 in Figure 3 legend) with stronger effects at 60 g/day or more,
    so a linear per-28.4 g slope drawn from trials at a median 56 g/day may misstate effects at 5-30 g/day. Only 5 trials
    (4 nonrandomized, 1 randomized) gave 100 g/day. The authors' own translation (Discussion): the randomized-trial LDL
    reduction of 4.2 mg/dL per serving predicts HR 0.96 (0.93-0.99) for coronary events.
    Conversion stated in Figure 2 legend: mg/dL x 0.0259 = mmol/L. Peanuts were excluded (classed as legumes), so
    this row does not cover peanuts. Counts differ within the paper: Results text says 42 randomized and 18
    nonrandomized trials, Table 1 and Figure 1 say 42 and 19, Table 2 LDL rows say 38 and 23.
    Funding: NHLBI grant; the review was performed under an LSRO contract funded by the International Tree Nut Council.

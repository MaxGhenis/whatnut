- id: ihme_bop_nuts_seeds_ihd
  kind: reference_value
  exposure: "Nuts and seeds (IHME risk 114, 'Diet low in nuts and seeds'), g/day versus 0 g/day"
  outcome: "Ischemic heart disease (IHME cause 493)"
  measure: RR
  unit: null
  estimate: 0.757
  ci_low: 0.628
  ci_high: 0.913
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "15th to 85th percentile of exposure in the data: 0 to 23.5 g/day; the curve is reported to 100 g/day"
  population: "Global, both sexes, all ages; 13 studies, 70 observations (6 flagged as outliers)"
  notes: >-
    Burden of Proof mean relative risk curve. It falls to 0.757 by about 8 g/day (0.7574 at 8.08 g/day;
    the minimum, 0.7571, comes further out) and stays flat from there to 100 g/day, so 0.757 is the RR at any
    intake of roughly 8 g/day or more. The interval is the
    outer band, which includes between-study heterogeneity; Zheng et al. report 95% uncertainty intervals
    built from the fixed-effect posterior and the 95% quantile of heterogeneity. Star rating 2 (weak
    evidence); risk-outcome score (ROS) 0.105, where two stars means ROS above 0 up to 0.14. The exposure
    includes seeds (DESIGN.md decision 8). Values read from the IHME Burden of Proof API
    (https://vizhub.healthdata.org/burden-of-proof/api/v1/output_data?risk=114&cause=493 and
    .../risk_cause_metadata?risk=114&cause=493), cached in data/curves/raw/ihme_bop/; the full curve is
    data/curves/ihme_bop_nuts_seeds_ihd.csv. The method is Zheng et al. 2022 (Nature Medicine, doi
    10.1038/s41591-022-01973-2, cited as zheng2022bop from paper/extra.bib), which does not report this pair; the
    numbers come from IHME's visualization and its API, accessed 2026-09-23.

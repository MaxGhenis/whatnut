  ci_high: 1.47
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Allocated 30 g/day of mixed nuts on top of a Mediterranean diet"
  population: "7447 Spanish adults (men 55-80, women 60-80 years; 57% women) at high cardiovascular risk without CVD at enrollment; nut arm n = 2454, control n = 2450; median follow-up 4.8 years (IQR 2.8 to 5.8)"
  notes: >-
    Intention-to-treat analysis of all 7447 participants. Cox model stratified by sex, recruiting site and
    education (five categories), adjusted for age, smoking, hypertension, dyslipidemia, diabetes, family history
    of premature CHD, BMI, waist-to-height ratio, physical activity (quintiles) and propensity scores built from
    30 baseline variables; robust standard errors for intracluster correlation (Table 3, footnote to the
    adjusted rows). Deaths: 116 in the nut arm (11.2 per 1000 person-years; 10,365 person-years) vs 114 in
    control (11.7 per 1000; 9,763 person-years); 5-year absolute risk 5.4% in both. Same table: olive-oil arm
    0.90 (0.69-1.18); both Mediterranean arms combined 0.98 (0.77-1.24). Figure 1B shows the same nut-arm HR.
    Events counted through December 1, 2010; database locked September 2011. The Discussion says event rates
    were lower than anticipated, reducing power for components of the primary end point. Why this is a
    reanalysis: the 2018 paper says the investigators withdrew their 2013 report after finding departures
    from randomization: 425 household members assigned without randomization to the enrolled member's group;
    467 participants at Site D (1 of 11 sites) assigned by clinic rather than individually; apparently
    inconsistent use of randomization tables at Site B (593 participants). The revised estimates do not rely
    exclusively on the assumption that everyone was randomized. (The Table 3 footnote counts 617 Site D
    participants excluded in the sensitivity analysis, vs 467 in Methods; not reconciled here.) PubMed lists
    the 2013 report (doi 10.1056/NEJMoa1200303, PMID 23432189) as a Retracted Publication, with the retraction
    notice at N Engl J Med 2018;378(25):2441-2442 (doi 10.1056/NEJMc1806491). The contrast bundles the
    Mediterranean diet advice with the nuts. Funding: Instituto de Salud Carlos III and others; walnuts donated
    by the California Walnut Commission, almonds by Borges, hazelnuts by Morella Nuts; the paper says sponsors
    had no role. Source text: NEJM online-first article PDF (14 pages) hosted by the PREDIMED investigators,
    https://www.predimed.es/uploads/8/0/5/1/8051451/nejmoa1800389_olf.pdf, saved as
    texts/estruch2018predimed_nejm_predimed_es.pdf (SHA-256 ca8c63ac2f8e...). Supplementary Appendix not read.

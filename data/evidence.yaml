    title: "Nut consumption and risk of cardiovascular disease, total cancer, all-cause and cause-specific mortality: a systematic review and dose-response meta-analysis of prospective studies"
    journal: "BMC Medicine"
    year: 2016
    volume: "14"
    issue: "1"
    pages: "207"
  locator: "Abstract (Results); Results, 'Nuts and all-cause mortality'; Table 1; Additional file 1 Tables S15 and S17"
  verified:
    doi_resolves: true
    title_matches: true
    first_author_matches: true
    value_checked_in: "full text"
    checked_on: "2026-09-23"


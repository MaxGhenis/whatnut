- id: wang2025_mr
  kind: mendelian_randomization
  exposure: "Genetically predicted salted or roasted peanut consumption (UK Biobank 24-h recall GWAS; 14 SNPs at p < 5e-6)"
  outcome: "Ischaemic heart disease (FinnGen R9)"
  measure: OR
  unit: null
  estimate: 1.4866
  ci_low: 1.0491
  ci_high: 2.1065
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: null
  population: "European ancestry: exposure GWAS from UK Biobank (MRC IEU OpenGWAS); outcomes from FinnGen R9 (n = 377,277)"
  notes: >-
    Main result: no causal effect of any of four exposures (unsalted peanuts, unsalted nuts, salted or roasted
    nuts, salted or roasted peanuts) on AF, angina, coronary atherosclerosis, CHD, IHD, MI, SAH, ICH or stroke,
    except the salted or roasted peanut to IHD signal above (IVW fixed effects, p = 0.0258). That p is above the
    paper's own Bonferroni threshold of 0.0056, so the Results call it suggestive, while the Discussion says it
    holds after Bonferroni correction; the paper contradicts itself. Mediation: fasting insulin 16.98%, LDL
    6.38%, fasting glucose 4.91% (total 28.27%). Two red flags: the printed LDL first-step CI (-0.0052 to
    -0.1272) does not contain its estimate (0.0662), and the LDL-to-IHD estimate is negative (-0.3822),
    opposite in sign to the statin-trial rows (ctt2010_*). Instrument strength: too few SNPs reached
    p < 5e-8 or 5e-7 (under three), so instruments were taken at a relaxed p < 5e-6 (45, 16, 22 and 14 SNPs for
    the four exposures); authors report every F statistic above 10; variance explained is not in the main text. The exposure
    is a 24-h recall item, so the unit of the OR is not a gram dose (Supplemental Table 1 not read). Funding:
    none declared.

  notes: >-
    Random-effects linear dose-response. Twelve cohort studies (11 publications); abstract and Table 1 give n = 12.
    I2 = 60% (Table 1: 59.6%), P heterogeneity = 0.004. Egger P = 0.07, explained by one small study; excluding it
    0.80 (0.72-0.89). Nonlinearity P = 0.001: risk falls to about 15 g/day with no further reduction at higher intake.

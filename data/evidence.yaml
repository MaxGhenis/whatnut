- id: balakrishna2022_umbrella
  kind: cohort_meta_dose_response
  exposure: "Total nuts, 28 g/day vs none (per serving)"
  outcome: "All-cause mortality"
  measure: RR
  unit: "per 28 g/day"
  estimate: 0.78
  ci_low: 0.72
  ci_high: 0.84
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Dose-response curves plateau from about 20 g/day (Supplemental Figure 16, not retrieved)"
  population: "Umbrella review of 89 articles (23 meta-analyses of disease and mortality); the all-cause estimate comes from the most comprehensive meta-analysis: 16 estimates, 819,448 participants, 85,870 deaths"
  notes: >-
    Re-reports Aune 2016: Figure 3 attributes the all-cause row to reference 16 (Aune et al. 2016), with the same
    RR, CI, I2 66%, participants and deaths as aune2016_allcause_per28g, so it is not independent evidence. AMSTAR-2
    rating high. Shares authors with Aune 2016: Dagfinn Aune and Lars T. Fadnes wrote both. Search to 27 May 2021;
    PROSPERO CRD42021258300. Per 28 g/day in the text: CVD 0.79 (0.70-0.89), CHD 0.75 (0.64-0.88), CVD mortality
    0.78 (0.73-0.83), cancer mortality 0.89 (0.83-0.94); Figure 3 prints different values for CVD mortality (0.94)
    and cancer mortality (0.97), so text and figure disagree there; the all-cause values agree.
    Allergy: abstract, allergy and related adverse reactions to nuts in 1-2% of adult populations, with substantial
    heterogeneity; Discussion cites a European meta-analysis (Nwaru 2014). Results: challenge-proven tree-nut
    allergy in adults 0.4-1.4% (Zuidmeer 2008); peanut allergy 0-2.8% by gold-standard diagnosis; sesame 0.1-0.2%.
    Funding: authors funded by their institutions, no additional funding; no conflicts declared.
  source:

- id: rajaram2021_waha_walnut_ldl
  kind: rct_mediator
  exposure: "Walnut-supplemented usual diet (about 15% of energy, 30-60 g/day raw walnuts) vs walnut-free control diet, 2 years"
  outcome: "LDL cholesterol (Friedewald), 2-year change, walnut vs control"
  measure: mean_difference
  unit: "mg/dL"
  estimate: -4.3
  ci_low: -6.6
  ci_high: -1.6
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "30 to 60 g/day for 2 years"
  population: "Cognitively healthy adults aged 63-79 in Barcelona, Spain and California, USA; 708 randomized, 636 completed, 628 with full lipoprotein data (mean age 69, 67% women, 32% on statins); mean baseline LDL-C 117 mg/dL"
  notes: >-
    Two-center, parallel-group RCT (WAHA, NCT01634841), research letter; lipoproteins were a prespecified secondary
    outcome. Walnuts delivered every 8 weeks. Between-group difference by ANCOVA adjusted for center, age, sex, BMI,
    smoking, APOE e4, change in physical activity, diabetes, dyslipidemia, hypertension, statin use, change in statin
    dose and baseline value (Figure legend). LDL-C -4.3 mg/dL is a 3.6% reduction; total cholesterol -8.5 (-11.2 to
    -5.4); IDL cholesterol -1.3 (-1.5 to -1.0); LDL particle number -4.3%, small LDL particles -6.1%; triglycerides and
    HDL unchanged. LDL-C fell 7.9% in men and 2.6% in women (P interaction 0.007); results did not differ by site.
    Primary physicians could change lipid drugs; in-trial statin changes did not differ by arm. Weight change:
    walnut +0.06 kg (-0.32 to 0.44), control -0.51 kg (-0.91 to -0.12). The printed CI is asymmetric about -4.3.
    Computed here, assuming linearity at the 45 g/day midpoint: about -2.7 mg/dL per 28.4 g/day, against -4.2 in
    Del Gobbo's randomized trials (median 5.5 weeks). Funding: grant from the California Walnut Commission (no role
    in design, analysis or writing, per the paper); Rajaram, Sala-Vila, Sabaté and Ros received Commission research
    funding; Sabaté and Ros were unpaid Commission advisory council members; Ros was a paid member of its Health
    Research Advisory Group. Reviewer's claim (-4.3, -6.6 to -1.6; 15% of energy; 30-60 g/day) matches the source.

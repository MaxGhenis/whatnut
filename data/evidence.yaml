  notes: >-
    Direction: cohort evidence is the reference; RRR = RR from RCTs divided by RR from cohorts (worked example in
    Methods: RCT 0.95 vs cohort 0.90 gives 1.06). The authors caution the RRR shows only differences between bodies of
    evidence, and its direction depends on the direction of the underlying effects: for a protective cohort RR below 1,
    RRR above 1 means the RCT estimate is closer to null. Random effects; I2 = 68%, tau2 = 0.021; 95% prediction
    interval given. Sensitivity: one outcome per review 1.14 (1.06-1.22), PI 0.81-1.61. Pairs by type of intake
    (counted in Supplementary Figure 9): intake v intake 23, supplements v supplements 7, intake plus supplements v
    intake 12, supplements v intake 16, supplements v status 13 (total 71). RRR below 1 in 24 of 71 pairs (Discussion).
    No nut or nut-food pair is in the corpus. Funding: Deutsche Forschungsgemeinschaft and the Freiburg medical
    faculty research commission; funders had no role.

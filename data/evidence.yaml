# --- Liu M et al. 2026, dose-response meta-analysis of nuts, CVD and all-cause mortality ---

- id: liu2026_nutmeta_allcause
  kind: cohort_meta_dose_response
  exposure: "Nut consumption, highest vs lowest intake category"
  outcome: "All-cause mortality"
  measure: RR
  unit: "highest vs lowest intake"
  estimate: 0.77
  ci_low: 0.73
  ci_high: 0.81
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Intake range not given in the abstract; full text not read"
  population: "Prospective cohort studies: 33 publications (63 studies) across CHD, stroke, CVD, CVD mortality and all-cause mortality; the abstract does not give the all-cause count; search to 24 October 2023"
  notes: >-
    Abstract only: the full text is paywalled (OpenAlex: closed access; Europe PMC: subscription; ScienceDirect
    returned HTTP 403). Random-effects models; restricted cubic splines; NutriGrade for certainty. Highest vs
    lowest intake, all-cause mortality 0.77 (0.73-0.81); per 28 g weekly increase 0.92 (0.90-0.94); all-cause
    association nonlinear (P nonlinearity < 0.001). Other outcomes per 28 g weekly: CHD 0.96 (0.95-0.97), stroke
    0.99 (0.97-1.01), CVD 0.98 (0.97-0.99), CVD mortality 0.90 (0.86-0.94). Unit caution: if the increment is
    28 g/week (4 g/day), the implied RR per 28 g/day is 0.92^7 = 0.56 (computed here), far steeper than Aune 2016's
    0.78, so the unit may be misprinted in the abstract. The row's estimate is therefore the highest-vs-lowest
    contrast, which the abstract states without a unit problem; the per-28 g weekly figure is not used. The 63 studies count every outcome, not all-cause mortality alone. Authors (Zhengzhou University and
    Shenzhen University, China) do not overlap with Aune or Fadnes; its author Hu F is Fulan Hu (Crossref), not
    Frank B. Hu. Funding (Crossref funder metadata): National Natural Science Foundation of China, Guangdong Basic and
    Applied Basic Research Foundation, China Postdoctoral Research Foundation, Shenzhen Science and Technology
    Innovation Program; no competing interests declared (PubMed). PubMed entry December 2025; issue March 2026.
  source:

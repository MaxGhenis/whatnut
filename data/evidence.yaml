- id: eslamparast2017_golestan
  kind: cohort
  exposure: "Total nuts, 3 or more 28 g servings per week vs never (FFQ at baseline)"
  outcome: "All-cause mortality"
  measure: HR
  unit: null
  estimate: 0.71
  ci_low: 0.58
  ci_high: 0.86
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Mean intake 3.5 g/day in men, 2.6 g/day in women; top category is 3+ servings/week (about 12 g/day or more; computed from 3 x 28 g / 7)"
  population: "Golestan Cohort Study, northeast Iran: 49,112 adults aged 40+ at 2004 baseline with complete diet data; 3,981 deaths over 349,677 person-years (median follow-up 7 y)"
  notes: >-
    Pooled (both sexes) multivariable HRs vs never: under 1 serving/week 0.89 (0.82-0.95); 1 to under 3/week
    0.75 (0.67-0.85); 3+/week 0.71 (0.58-0.86); P trend < 0.001. Women 3+/week 0.49 (0.34-0.71); men 0.84
    (0.66-1.07), men's trend P = 0.060. Adjusted for age, sex, BMI, education, residence, smoking, opium, alcohol,
    physical activity, wealth score, diabetes, hypertension, energy, main food groups, Mg, Zn, Cu. Cause-specific,
    pooled, 3+/week: CVD 0.77 (0.58-1.01), trend P = 0.018; all cancer 0.62 (0.38-1.01), trend P = 0.029
    (Table 3). Peanuts 0.74 (0.62-0.89) and tree nuts 0.76 (0.66-0.88) for 1+ serving/week vs none. Confounding
    check: here higher nut intake went with MORE smoking and alcohol, higher BMI and LESS exercise, the opposite
    of Western cohorts; but nut eaters were also younger, wealthier, more urban and more educated, so SES
    confounding remains possible (Discussion). Results held after excluding smokers, opium and alcohol users,
    extreme wealth deciles and BMI, baseline chronic disease, and deaths in the first 2 years (Table 5).
    Funding: Tehran University of Medical Sciences, Cancer Research UK, US NCI intramural program, IARC.
    Published online 5 March 2016; print issue February 2017.

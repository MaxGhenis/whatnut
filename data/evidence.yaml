# --- Ference et al. 2017, EAS consensus: LDL causes ASCVD; cumulative exposure ---

- id: ference2017_ldl_cumulative
  kind: mendelian_randomization
  exposure: "LDL-C lower by 1 mmol/L over about 40 years of exposure (genetically lower LDL-C, as in Mendelian randomization)"
  outcome: "Atherosclerotic cardiovascular disease events (long-term proportional risk reduction)"
  measure: RR
  unit: "per 1 mmol/L lower LDL-C sustained 40 years"
  estimate: 0.46
  ci_low: null
  ci_high: null
  ci_level: null
  pi_low: null
  pi_high: null
  support: "Figure 2: Mendelian randomization studies, median follow-up 52 y (N = 194,427); randomized trials, median 5 y (N = 196,552)"
  population: "Consensus panel synthesis of published meta-analyses: Mendelian randomization (text: over 300,000 participants, 80,000 CHD cases), prospective cohorts, randomized trials"
  notes: >-
    A planning value, not a pooled estimate: the panel's Tables 2 and 4 assume a 54% risk reduction per mmol/L over
    40 years of exposure, as estimated from Mendelian randomization, computed as 1 - 0.46^(LDL-C reduction in mmol/L)
    (Table 2 and Table 4 footnotes). The short-term counterpart is a 22% reduction per mmol/L over 5 years from
    randomized trials, 1 - 0.78^(reduction) (Table 2 and Table 3 footnotes), taken from the CTT statin
    meta-analysis: 22% per mmol/L over a median 5 years (Evidence from randomized controlled trials; ref 32).
    Duration formula (Table 2 footnote): proportional reduction per mmol/L = 1 - exp(-0.249 - 0.0152 x (years - 5));
    computed here, 22.0% at 5 y and 54.2% at 40 y. Text (cumulative-effect section): about 10% in year 1, 16% after
    2 y, 20% after 3 y, then about 1.5% more per year; 5 y gives about 20-25% and 40 y about 50-55% per mmol/L.
    Mendelian randomization suggests up to a three-fold greater proportional reduction per unit LDL-C than
    shorter statin treatment started later in life (ref 28, Ference 2012 JACC; not read here). Figure 2 (image)
    draws three lines: Mendelian randomization (52 y), cohorts (12 y, N = 403,501), trials (5 y); at 1 mmol/L the
    MR line sits near 52-53% by eye. The lifetime figure is for LDL-C lower from birth; the panel extrapolates it to
    treatment of equal total duration and says any mechanism that lowers LDL particles should act the same.
    Funding: travel and meeting logistics from unrestricted educational grants by MSD and Amgen to the European
    Atherosclerosis Society; the companies had no role in content; most panel members report industry ties.
    Reviewer's claim (about 54% vs about 22% per mmol/L) matches the source.

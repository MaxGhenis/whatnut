  notes: >-
    Random-effects linear dose-response, I2 = 76.2%, P heterogeneity < 0.001. The fixed-effects estimate is
    0.99 (0.98-1.01), not significant (Results, 'Fixed effects meta-analysis: mortality'); the NIH-AARP study carries
    62.1% of the fixed-effects weight, and excluding it gives a fixed-effects slope of 0.98 (0.96-0.99). So the

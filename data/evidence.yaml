# What Nut evidence rows. Schema: DESIGN.md, "Evidence row schema".
# A number enters estimate / ci_* / pi_* only if the checker read it in the source
# on checked_on. Crossref records for every DOI are cached in data/sources/crossref/;
# the texts the core rows were checked against (PubMed records, full texts, figures,
# supplements) are in data/sources/crossref/texts/ with MANIFEST.json
# (scripts/fetch_evidence_sources.py --texts). Quotes are at most 15 words.

# core model rows

# --- Aune et al. 2016, nuts and mortality, cohort dose-response meta-analysis ---

- id: aune2016_allcause_per28g
  kind: cohort_meta_dose_response
  exposure: "Total nuts (tree nuts and peanuts), per 28 g/day increment"
  outcome: "All-cause mortality"
  measure: RR
  unit: "per 28 g/day"
  estimate: 0.78
  ci_low: 0.72
  ci_high: 0.84
  ci_level: 0.95
  pi_low: null
  pi_high: null
  support: "Nonlinear curve tabulated from 0 to 28 g/day (Additional file 1, Table S15); risk flat to slightly rising above 15-20 g/day"
  population: "Prospective cohorts (US, Europe, Asia, Australia); 85,870 deaths among 819,448 participants in the dose-response analysis"
  notes: >-
    Random-effects (DerSimonian-Laird) linear dose-response (Greenland-Longnecker), serving defined as 28 g.
    Studies: 15 cohort studies (15 publications, 16 risk estimates) per Results; abstract says n = 15; Table 1 lists N = 16 for the
    dose-response. Heterogeneity I2 = 66%, P < 0.0001. Egger P = 0.02; excluding five studies with under 500 deaths gives
    RR 0.80 (0.74-0.87) with Egger P = 0.25. Nonlinearity P < 0.0001; the paper reports
    "no further reduction in risk above 15-20 grams per day" (Results, all-cause section). Table S15 nonlinear RRs:
    5 g 0.89, 10 g 0.84, 15 g 0.82, 20 g 0.82, 25 g 0.84, 28 g 0.85 (the table caption says "peanuts", but the main text
    cites Table S15 for the total-nut all-cause curve). By nut type, per 10 g/day: tree nuts 0.82 (0.75-0.90; n = 3 in
    Results text, 4 in Table 1), peanuts 0.77 (0.69-0.86, n = 5), peanut butter 0.94 (0.86-1.02, n = 2). Subgroup:
    follow-up under 10 y 0.61 (0.49-0.76, n = 7) vs 10 y or more 0.84 (0.79-0.90, n = 9), P = 0.03 (Supplementary
    Table 17). Funding: Olav og Gerd Meidel Raagholt's foundation, the Central Norway RHA-NTNU Liaison Committee, and the
    Imperial College NIHR Biomedical Research Centre; funders had no role (Declarations).
  source:
    key: aune2016nut
    doi: "10.1186/s12916-016-0730-3"
    pmid: "27916000"
    pmcid: "PMC5137221"
    first_author: "Aune"
    authors: "Aune D, Keum N, Giovannucci E, Fadnes LT, Boffetta P, Greenwood DC, Tonstad S, Vatten LJ, Riboli E, Norat T"
    title: "Nut consumption and risk of cardiovascular disease, total cancer, all-cause and cause-specific mortality: a systematic review and dose-response meta-analysis of prospective studies"
    journal: "BMC Medicine"
    year: 2016
    volume: "14"
    issue: "1"
    pages: "207"
  locator: "Abstract (Results); Results, 'Nuts and all-cause mortality'; Table 1; Additional file 1 Tables S15 and S17"
  verified:
    doi_resolves: true
    title_matches: true
    first_author_matches: true
    value_checked_in: "full text"
    checked_on: "2026-09-23"


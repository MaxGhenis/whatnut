nut_intakes_g_per_day:
  typical_western: 0.0
  feasibility: 12.5
  optimized: 25.0
  optimized_description: 1 handful of nuts
  locator: Methods, list of TW/FA/OD intakes; S1 Table columns 'Sliders start' and 'Optimized'; S2 Table
  note: S3 Text estimates US intake at 11 g/day (S1 Table 'US, mean intake' 11), but the model's typical
    Western diet uses 0 g/day for nuts.
  us_estimated_intake_g_per_day: 11.0
relative_risk:
  measure: HR for all-cause mortality versus 0 g/day, read off a grid by intake
  grid_g_per_day:
  - 0
  - 25
  - 50
  - 100
  - 150
  hr:
  - 1.0
  - 0.84
  - 0.86
  - 0.9
  - 0.95
  half_width_to_95ci:
    '25': 0.02
    '50': 0.04
    '100': 0.08
    '150': 0.12
  hr_at_optimal_25g: 0.84
  ci95_at_25g:
  - 0.82
  - 0.86
  uncertain_above_g_per_day: 50
  no_estimate_above_g_per_day: 200
  source: Aune et al. 2016 BMC Medicine (Fadnes ref 4); S1 Table 'Publication' column
  applied_to: 'All-cause mortality (Methods: mortality rates multiplied by the hazard ratio for the change)'
  locator: S1 Table (pmed.1003889.s004), Nuts row and the 'Mid to upper/lower' row beneath it
  value_checked_in: supplementary table (PDF text; column alignment confirmed on the rendered page)
  match_to_aune: Aune 2016 Table S15 all-cause RR at 25 g/day is 0.84 (0.82-0.85); Fadnes uses 0.84 +/-
    0.02. The 50, 100 and 150 g/day HRs lie beyond Aune's 28 g/day table and are Fadnes's own extension
    (flagged orange, 'uncertain', in S1 Table).
  feasibility_hr_not_stated: The HR used for 12.5 g/day is not printed. The feasibility gains are about
    half the optimized gains (S2 Table). That fits interpolating the S1 Table grid between 0 and 25 g/day
    (HR about 0.92), not Aune's curve, which is already 0.84 at 10 g/day. Inference only; the paper does
    not say.

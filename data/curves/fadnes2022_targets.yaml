mortality_data:
  source: GBD 2019 (published 2020), IHME GBD results tool / cause of death database (Fadnes ref 12)
  year: 2019
  measure: all-cause mortality rates for the United States, 5-year age groups, converted to single years
  baseline_assumption: GBD population mortality is treated as the typical-Western-diet mortality; Table
    1 labels the GBD-based life expectancy as the typical Western diet LE.
  locator: Methods, paragraphs on GBD mortality and background mortality; Table 1
  typical_diet_LE_us:
    age_20:
      male: 57.8
      female: 62.5
    age_40:
      male: 39.4
      female: 43.3
    age_60:
      male: 22.4
      female: 25.3
    age_80:
      male: 9.0
      female: 10.3
  typical_diet_LE_locator: Table 1, United States rows, Typical Western LE columns
life_table_method:
  summary: Standard life table; LE(D) - LE(D0) with age-specific mortality rates after the change age
    multiplied by the food group's hazard ratio.
  locator: Methods, LE(D) definition paragraphs
  details_from_cited_method:
    citation: Johansson KA, Økland J-M, Skaftun EK, et al. Estimating Health Adjusted Age at Death (HAAD).
      PLoS One 2020;15(7):e0235955 (Fadnes ref 13; PMC7360045)
    age_groups: GBD 5-year groups to 95+; each single year in a group gets the group's rate
    q_from_rate: q = 1 - exp(-M_all_causes)
    max_age: Y = 99; survival from 99 to 100 set to zero
    locator: Johansson 2020, Methods (single-year conversion; lifetable paragraph) and Table 1
    caveat: Fadnes defers to this paper for the background-LE method but does not restate these choices,
      so their use in Fadnes 2022 is inferred.
  not_stated_in_fadnes:
  - whether the HR multiplies the rate before converting to q (Johansson's q = 1 - exp(-M) suggests so)
  - within-year timing of deaths (mid-year or other) for the LE sum
  - whether the phase-in scales the HR linearly or the log HR
  - the HR at 12.5 g/day (feasibility diet)
  - how the 95+ group is split into single years for rates
uncertainty_method:
  draws: 200
  distribution: uniform between the lower and upper 95% CI of each food group's HR
  interval: 2.5th and 97.5th percentiles; fixed seed
  locator: Methods, uncertainty paragraph
other_choices:
  food_groups_independent: Each food group treated as an independent protective or risk factor; the per-food
    gains are single-food changes, and the whole-diet total is smaller than their sum (S2 Table), consistent
    with multiplied hazard ratios.
  optimal_intake_rule: Optimized intake set where the dose-response showed no further mortality gain.
  nutrigrade_nuts: 7
  sensitivity_hr_adjustment: HRa = HR0 + (1 - HR0)(1 - m), m in 0.5-1.5, reported as sensitivity-adjusted
    intervals (S15 Fig).
  software: Web calculator built with R Shiny (food4healthylife.org); graphs and forest plots in Stata
    SE 17.0 (admetan)
  locator: Methods

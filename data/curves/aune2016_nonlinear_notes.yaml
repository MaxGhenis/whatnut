text_statements:
- outcome: all_cause_mortality
  statement: Nonlinear; steeper risk reduction at lower intakes and no further reduction above 15-20 g/day.
  locator: Results, 'Nuts and all-cause mortality' paragraph; Fig. 4b; Additional file 1 Table S15
- outcome: cvd_incidence_or_mortality
  statement: Nonlinear; risk falls up to about 15 g/day with no further reduction at higher intakes.
  locator: Results, cardiovascular disease paragraph; Fig. 3b; Additional file 1 Table S14
- outcome: chd_incidence_or_mortality
  statement: Nonlinear; only slight further reductions above 15-20 g/day.
  locator: Results, coronary heart disease paragraph; Fig. 2b; Table S14
- outcome: stroke_incidence_or_mortality
  statement: 'Slight J shape: reductions up to about 10-15 g/day, slight positive association at 30 g/day.'
  locator: Results, stroke paragraph; Fig. 2d; Table S14
- outcome: total_cancer
  statement: No evidence of nonlinearity in the Results (P = 0.11), though the Discussion lists cancer
    among nonlinear outcomes.
  locator: Results, total cancer paragraph; Discussion, first paragraph
- outcome: all outcomes
  statement: Most of the risk reduction occurs up to about 15-20 g/day (5-6 servings a week).
  locator: Discussion, first paragraph
- outcome: population attributable fraction
  statement: The authors took 20 g/day as the optimal intake for attributable-death estimates, citing
    little further reduction above it.
  locator: Methods, statistical methods, attributable-risk paragraph
method: Restricted cubic splines with three knots at the 10th, 50th and 90th percentiles of intake, combined
  by multivariate meta-analysis; nonlinearity tested by likelihood ratio (Methods, statistical methods).
  Reference is 0 g/day. One serving = 28 g.

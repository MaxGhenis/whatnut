source:
  citation: 'Aune D, Keum N, Giovannucci E, et al. Nut consumption and risk of cardiovascular disease,
    total cancer, all-cause and cause-specific mortality: a systematic review and dose-response meta-analysis
    of prospective studies. BMC Medicine 2016;14:207.'
  doi: 10.1186/s12916-016-0730-3
  pmid: '27916000'
  pmcid: PMC5137221
  files:
  - raw/aune2016_PMC5137221.xml
  - raw/aune2016_MOESM1_ESM.pdf
  checked_on: '2026-09-23'
what_the_csv_holds: 'Every numeric point of the nonlinear (restricted cubic spline) dose-response for
  total nuts that the paper reports in numbers: Additional file 1, Supplementary Tables 14 and 15, RR
  (95% CI) at 0, 5, 10, 15, 20, 25 and 28 g/day versus 0 g/day. All-cause mortality and CVD mortality
  are the rows the model uses; CHD, stroke, total cancer, respiratory, diabetes and neurodegenerative
  rows are kept because they come from the same tables. The main-text curves (Figs 2b, 2d, 3b, 3d, 4b)
  are images only and were not digitized.'
table_titles_as_printed:
  S14: Supplementary Table 14. Relative risks from nonlinear dose-response analysis of peanuts and coronary
    heart ...
  S15: Supplementary Table 15. Relative risks from nonlinear dose-response analysis of peanuts and mortality
    from ...
table_title_discrepancy: 'Both table titles say ''peanuts'', but the tables are the total-nut nonlinear
  results: (1) the main text cites Table S14 for the total-nut CHD, stroke and CVD curves and Table S15
  for the total-nut all-cause curve (Results, all-cause and CVD paragraphs); (2) the tables run to 28
  g/day, while the peanut all-cause spline (Supplementary Figure 41) has an x axis of [0, 5, 10] g/day
  (tree nuts, Figure 38: [0, 5, 10, 15, 20, 25, 30]); (3) the tables'' P-nonlinearity values do not match
  the peanut figures (see peanut_figure_p_nonlinearity). The S14 title also lists total cancer and all-cause
  mortality, which are in S15. Treat the tables as total nuts; the title is a labeling error.'

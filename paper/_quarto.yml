# Single-page manuscript. paper/index.qmd is GENERATED by paper/fill_paper.py
# from paper/index.qmd.in; edit the template, never index.qmd.
#
# Nothing executes at render time: the pipeline freezes every number into
# results/results.json and every figure into paper/figures/, fill_paper.py
# writes them into index.qmd, and Quarto only typesets. No kernel, no Jupyter.
#
#   python paper/render_paper.py          # fill, check, render, copy to public/whatnut/web/
#   quarto render paper --to html         # what Vercel and CI run on the committed index.qmd

project:
  type: default
  output-dir: _build
  render:
    - index.qmd

execute:
  enabled: false

lang: en-US
bibliography: references.bib
# No `csl:` key: Quarto's bundled default is Chicago author-date.
link-citations: true

number-sections: true
fig-cap-location: bottom
tbl-cap-location: top

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: Contents
    # Math is typeset to MathML by Pandoc at render time. KaTeX (and MathJax)
    # render client-side in JavaScript, and the wrapper at /whatnut/ embeds this
    # page in an iframe sandboxed without allow-scripts, so script-rendered math
    # would show as raw TeX there. MathML needs no script in any current browser.
    html-math-method: mathml
    anchor-sections: true
    link-external-newwindow: true
    # No 'Other formats' links: Vercel builds HTML only, so index.pdf may not exist.
    format-links: false
    link-external-icon: false
    code-copy: false
    smooth-scroll: false
  # PDF is optional: render_paper.py builds it only when a TeX engine is on
  # PATH. CI and Vercel render HTML only (`--to html`).
  pdf:
    documentclass: article
    pdf-engine: xelatex
    papersize: letter
    geometry:
      - margin=1in
    fontsize: 11pt
    colorlinks: true
    toc: false

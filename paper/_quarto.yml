# Single-page manuscript. paper/index.qmd is GENERATED by paper/fill_paper.py
# from paper/index.qmd.in; edit the template, never index.qmd.
#
# Nothing executes at render time: the pipeline freezes every number into
# results/results.json and every figure into paper/figures/, fill_paper.py
# writes them into index.qmd, and Quarto only typesets. No kernel, no Jupyter.
#
# Two builds produce the same _build/ (index.html, its figures, and index.pdf):
#
#   python paper/render_paper.py
#       local and CI: fill index.qmd from the template and results, check it,
#       stamp the wrapper, render HTML then the Typst PDF, copy _build/ to
#       public/whatnut/web/
#   quarto render paper --to html --no-execute
#   quarto render paper --to typst --no-execute
#       Vercel (vercel.json buildCommand, no Python): the same two renders of
#       the committed index.qmd, then the same copy. Quarto 1.9 rejects
#       `--to html,typst`, hence two calls; the typst render keeps index.html.

project:
  type: default
  output-dir: _build
  render:
    - index.qmd
  # Writes target="_blank" rel="noopener" into the HTML's external links, which
  # the sandboxed iframe at /whatnut/ needs (see the script). Quarto runs it
  # with its bundled Deno after every render, including Vercel's.
  post-render: external_links.ts

execute:
  enabled: false

lang: en-US
bibliography: references.bib
# No `csl:` key: Quarto's bundled default is Chicago author-date.
link-citations: true

number-sections: true
fig-cap-location: bottom
tbl-cap-location: top

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: Contents
    # Math is typeset to MathML by Pandoc at render time. KaTeX (and MathJax)
    # render client-side in JavaScript, and the wrapper at /whatnut/ embeds this
    # page in an iframe sandboxed without allow-scripts, so script-rendered math
    # would show as raw TeX there. MathML needs no script in any current browser.
    html-math-method: mathml
    anchor-sections: true
    # External links open in a new tab. Quarto's own link-external-newwindow
    # sets target="_blank" from JavaScript, which the sandboxed iframe never
    # runs, so external_links.ts (the project's post-render script, above)
    # writes the attributes into the HTML instead.
    link-external-newwindow: false
    # No 'Other formats' links: the wrapper at /whatnut/ carries its own
    # "Download PDF" action.
    format-links: false
    link-external-icon: false
    code-copy: false
    smooth-scroll: false
  # The PDF: Typst ships inside Quarto, so the quarto-only Vercel build makes
  # it too (no TeX). Pandoc's citeproc formats the references, as in the HTML.
  typst:
    citeproc: true
    papersize: us-letter
    margin:
      x: 1in
      y: 1in
    fontsize: 11pt
    toc: false
    # Typst sizes table columns to their content. The pipe tables' dash widths
    # (kept in the HTML as <colgroup> percentages) would wrap numbers and
    # citations onto two lines at the PDF's measure.
    tbl-colwidths: false
    # The HTML titles the bibliography in its appendix; the PDF needs a heading.
    reference-section-title: References
    # Tables: ragged-right cells, slightly smaller type, and a line break
    # allowed after each underscore so the appendix's long row ids stay inside
    # their column.
    include-in-header:
      text: |
        #show table.cell: set par(justify: false)
        #show table: set text(size: 0.9em)
        #show table.cell: it => { show "_": "_" + sym.zws; it }

# US age-band health-related quality of life (HRQoL) norms.
# Source: Jiang R, Janssen MFB, Pickard AS. "US population norms for the
# EQ-5D-5L and comparison of norms from face-to-face and online samples."
# Quality of Life Research. 2021;30:803-816.
# doi:10.1007/s11136-020-02650-y; PMCID: PMC7952367.
# https://pmc.ncbi.nlm.nih.gov/articles/PMC7952367/
#
# These are the exact face-to-face sample mean US EQ-5D-5L utilities reported
# in Table 3. Each value applies as a step function from its lower-bound age
# through the year before the next boundary; the published 75+ norm is held
# constant through the CDC life table's age-100+ open interval. No unsupported
# old-age decline is extrapolated.

weights:
  20: 0.919
  25: 0.911
  35: 0.841
  45: 0.816
  55: 0.815
  65: 0.824
  75: 0.811

# Confounding prior
# Single canonical prior: Beta(1.5, 6.0) with mean 0.20
# Skeptical by default; 95% CI [0.02, 0.53]
# Reflects healthy-user bias, weak MR evidence, and incomplete mechanistic translation
confounding:
  alpha: 1.5
  beta: 6.0
  mean: 0.20
  ci_lower: 0.02
  ci_upper: 0.53
  rationale: >
    Skeptical prior reflecting substantial residual healthy-user confounding,
    weak Mendelian-randomization evidence, and the gap between intermediate-risk
    factor improvements and observed cohort mortality associations. The LDL
    pathway implies a low double-digit causal floor, while broader pathway and
    substitution effects plausibly raise the causal fraction somewhat above that.
    Beta(1.5, 6.0) centers the base case at 20% while leaving non-trivial mass
    on both near-null and moderately causal scenarios.

# Identified compositional effects retained for a future action that models a
# specific displaced food. They are deliberately not applied to gross addition.
substitution_contrasts:
  omega6_for_saturated_fat:
    mean: -0.0582669
    sd: 0.0128372
    unit: "log HR per 1 percentage point of energy exchanged"
    outcome: "CVD mortality"
    contrast: "Replace saturated fat with an equal-energy amount of omega-6 PUFA"
    source_url: "https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2530902"
    source: "Wang 2016: HR 0.89 (95% CI 0.85-0.94) per 2% energy replacement. Mean ln(0.89)/2 and CI-derived SE [ln(0.94)-ln(0.85)]/(3.92*2). At 2,000 kcal/day only, this corresponds to -0.0262201 (SD 0.0057767) per gram exchanged."

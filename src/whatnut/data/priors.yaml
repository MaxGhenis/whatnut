# Nutrient-pathway priors for Monte Carlo uncertainty propagation
# Each prior is Normal(mean, sd) for log-RR per unit nutrient
# Organized by mortality pathway
#
# Key scientific decisions:
# - ALA CVD prior: -0.05/g (Naghshi 2021: RR 0.95 per 1g/day CVD mortality, ln(0.95)=-0.051)
# - Skeptical confounding prior: Beta(1.5, 6.0) mean 0.20 (defined below)
# - No hand-curated nut multipliers or uncalibrated residual variance

nutrients:
  - ala_omega3
  - omega6
  - omega7
  - fiber
  - saturated_fat
  - magnesium
  - arginine
  - vitamin_e
  - phytosterols
  - protein

pathways:
  - cvd
  - cancer
  - other

cvd:
  ala_omega3:
    mean: -0.0512933
    sd: 0.0189051
    unit: g
    outcome: "CVD mortality"
    contrast: "1 g/day higher dietary ALA intake"
    source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8513503/"
    source: "Naghshi 2021: CVD mortality RR 0.95 (95% CI 0.91-0.98) per 1 g/day. Mean ln(0.95); CI-derived SE [ln(0.98)-ln(0.91)]/3.92."
  omega6:
    mean: 0.0
    sd: 0.0
    unit: g
    outcome: "CVD mortality"
    contrast: "No identified gross-addition contrast"
    source_url: "https://dash.harvard.edu/bitstreams/7312037d-eeb5-6bd4-e053-0100007fdf3b/download"
    applicable_actions: []
    source: "Excluded from the gross-addition action. Farvid 2014 estimates linoleic acid replacing saturated fat, not an independent effect of adding omega-6. The identified joint contrast is retained under substitution_contrasts."
  omega7:
    mean: 0.0
    sd: 0.0
    unit: g
    applicable_actions: []
    source: "Structurally excluded: no defensible dietary palmitoleic-acid dose-response for CVD mortality."
  fiber:
    mean: -0.0139262
    sd: 0.00204191
    unit: g
    outcome: "CVD mortality"
    contrast: "10 g/day higher dietary fiber intake"
    source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10579821/"
    source: "Yao 2023: CVD mortality RR 0.87 (95% CI 0.84-0.91) per 10 g/day. Mean ln(0.87)/10; CI-derived SE [ln(0.91)-ln(0.84)]/(3.92*10)."
  saturated_fat:
    mean: 0.0
    sd: 0.0
    unit: g
    outcome: "CVD mortality"
    contrast: "No identified gross-addition contrast"
    source_url: "https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2530902"
    applicable_actions: []
    source: "Excluded from the gross-addition action. Hard-outcome evidence identifies replacement of saturated fat with unsaturated fat or carbohydrate, not a context-free independent effect per added gram."
  magnesium:
    mean: -0.000304592
    sd: 0.000183229
    unit: mg
    outcome: "CVD mortality"
    contrast: "100 mg/day higher dietary magnesium intake"
    source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8321838/"
    source: "Bagheri 2021: CVD mortality effect size 0.97 (95% CI 0.94-1.01) per 100 mg/day. Mean ln(0.97)/100 and CI-derived SE [ln(1.01)-ln(0.94)]/(3.92*100). This replaces Fang 2016's 0.93 per 100 mg/day estimate, which is for stroke incidence rather than CVD mortality."
  arginine:
    mean: 0.0
    sd: 0.0
    unit: g
    applicable_actions: []
    source: "Structurally excluded: mechanistic and secondary-prevention evidence does not identify a dietary CVD-mortality coefficient."
  vitamin_e:
    mean: 0.0
    sd: 0.0
    unit: mg
    applicable_actions: []
    source: "Structurally excluded from the base case; dietary CVD-mortality evidence is compatible with the null."
  phytosterols:
    mean: 0.0
    sd: 0.0
    unit: mg
    applicable_actions: []
    source: "Structurally excluded: LDL lowering has not been translated through an explicit validated LDL-to-mortality model."
  protein:
    mean: 0.0
    sd: 0.0
    unit: g
    applicable_actions: []
    source: "Structurally excluded: available plant-protein mortality estimates are energy-substitution contrasts, not gross additions."


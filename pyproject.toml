[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatnut"
version = "0.3.0"
description = "How much life eating nuts buys a US adult: a small, fully sourced life-table model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Max Ghenis", email = "max@maxghenis.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=7.0",
    "ruff>=0.1",
]
# scripts/fetch_*.py (rebuilding data/ from the sources)
fetch = [
    "requests>=2.31",
    "pypdf>=6.10.2",
]

[project.urls]
Homepage = "https://github.com/MaxGhenis/whatnut"
Documentation = "https://www.maxghenis.com/whatnut/"

[tool.hatch.build.targets.wheel]
packages = ["src/whatnut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly online Crossref check: DOIs can go stale after the cache was written.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: python -m pytest tests/

  citations-offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system pyyaml
      - name: Check DOIs against the cached Crossref records
        run: python scripts/check_citations.py --offline

  citations-online:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system pyyaml
      - name: Check DOIs against api.crossref.org
        run: python scripts/check_citations.py

  paper:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv pip install --system -e .
      - name: Manuscript matches template and results
        run: python paper/fill_paper.py --check
      - name: Bibliography matches evidence
        run: python scripts/build_bib.py --check
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"
      - name: Render (fill, no-kernel checks, quarto render --to html, stage under public/)
        run: python paper/render_paper.py --no-pdf
      - name: Render left the committed files unchanged
        run: git diff --exit-code -- paper/ public/whatnut/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: whatnut-site
          path: public/
          retention-days: 14
